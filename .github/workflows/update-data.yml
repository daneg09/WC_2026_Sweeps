name: Update Tournament Data

on:
  schedule:
    - cron: '0 22 * * *'  # 06:00 AWST Perth
    - cron: '0 8 * * *'   # 16:00 AWST Perth
  workflow_dispatch:        # Manual run from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create package.json
        run: |
          echo '{"type":"module"}' > package.json

      - name: Verify data file exists
        run: |
          if [ ! -f data/tournament.json ]; then
            echo "::error::data/tournament.json not found — cannot run update. Make sure the file is committed to the repo first."
            exit 1
          fi

      - name: Fetch and update tournament data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/fetch-tournament-data.js

      - name: Commit updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/tournament.json
          git diff --staged --quiet || git commit -m "chore: auto-update tournament data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
